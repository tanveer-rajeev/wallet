
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  build:
    commands:
      - echo "Building wallet-service..."
      - mvn clean verify
      - mkdir -p deployment/scripts
      - cp appspec.yml deployment/
      - cp scripts/*.sh deployment/scripts/
      - cp target/wallet-service-0.0.1-SNAPSHOT.jar deployment/

artifacts:
  base-directory: deployment
  files:
    - '**/*'
