services:
  db:
    image: postgres:18
    container_name: wallet-db
    environment:
      POSTGRES_DB: wallet-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wallet-db-data: